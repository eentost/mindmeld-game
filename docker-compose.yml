version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mindmeld-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindmeld_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-mindmeld_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mindmeld-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindmeld_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mindmeld-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    networks:
      - mindmeld-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindmeld-backend
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev_secret_key}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mindmeld_user}:${POSTGRES_PASSWORD:-secure_password}@postgres:5432/${POSTGRES_DB:-mindmeld_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-jwt_secret_key}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mindmeld-network
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 wsgi:app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:5000}
    container_name: mindmeld-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - mindmeld-network

networks:
  mindmeld-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
